[pytest]
# Every locally generated artifact lives under core/.dev/ — never at the package root.
#
# There is deliberately NO --basetemp here. It WIPES AND RECREATES the directory it points at,
# so a fixed path made concurrent runs (several agent sessions share this checkout) delete each
# other's temp dirs and die at session start with a Windows PermissionError — which, since the
# pre-push gate runs the suite, failed pushes that had nothing wrong with them. `conftest.py`
# instead points PYTEST_DEBUG_TEMPROOT at .dev/tmp, and pytest allocates a numbered, lock-guarded
# pytest-<n> directory per RUN underneath it. Still inside core/ on purpose — see
# tests/core/test_tmp_dir_repo_boundary.py.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
# `-p no:xonsh` is why the suite stopped "hanging". xonsh is an unrelated shell that
# happens to be installed; pytest auto-loads its entry-point plugin, and importing
# `xonsh.platform` calls `platform.win32_ver()` -> a Windows WMI query. Cold, that query
# blocks for ~150 SECONDS, PER PROCESS. Under `-n auto` every xdist worker is a fresh
# process paying it, which is exactly what made the run look hung: >20 min wall-clock for
# ~13 CPU-seconds, because it was BLOCKED on WMI, not computing. Measured on this machine:
# collecting ONE agent test file went 150s+ -> 0.76s; an empty dir 10s (warm) -> 2s.
# Nothing in this repo imports xonsh, so never load it.
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --import-mode=importlib
    -p no:xonsh
tmp_path_retention_policy = failed
cache_dir = .dev/cache/pytest
markers =
    unit: Unit tests for individual functions
    integration: Integration tests requiring mocked dependencies
    slow: Tests that take longer to run
    requires_server: Tests that require actual server connection
    live: Tests that require a live running service (gateway, DB, etc.); exclude with -m 'not live'
asyncio_mode = auto
minversion = 3.10
log_file = .dev/logs/pytest.log
log_file_level = INFO
