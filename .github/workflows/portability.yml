name: Portability

# The cross-platform evidence NAVIG cannot produce on its maintainer's Windows machine:
# macOS in particular (no Apple hardware). Deliberately NOT the full suite — the full
# `CI` workflow is disabled while its Windows-assuming tests are ported — but the suites
# whose subject IS the platform: daemon/service lifecycle, installers, paths, the tray,
# the dashboard's key reader, and the POSIX parity pins. Manual trigger only, so it never
# burns minutes on routine mirror pushes; public repos run it free.

on:
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra pytest paths to add (space-separated)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install navig (editable) + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # navig-contacts is a hard dependency that is not on PyPI yet; install it from the
          # plugins mirror first so the editable install below can resolve.
          python -m pip install "git+https://github.com/navig-run/plugins#subdirectory=navig-contacts"
          python -m pip install -e ".[dev]" || python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-timeout pytest-mock psutil
      - name: Platform suites
        shell: bash
        env:
          PYTHONUTF8: "1"
          NAVIG_SKIP_ONBOARDING: "1"
          NAVIG_NO_TELEMETRY: "1"
        run: |
          python -m pytest -q -p no:cacheprovider -o addopts="" --timeout=300 \
            tests/regression/test_posix_parity.py \
            tests/regression/test_dashboard_panels_never_collapse_to_their_borders.py \
            tests/commands/test_dashboard_v2.py \
            tests/commands/test_tray.py \
            tests/platform \
            tests/installer \
            tests/ops/test_daemon.py \
            tests/service \
            ${{ github.event.inputs.extra }}

  installer-dry-run:
    name: installer --dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --dry-run
        if: runner.os != 'Windows'
        run: bash install.sh --dry-run
      - name: install.ps1 -DryRun
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -DryRun

  launchd-live:
    # The real macOS path the unit tests can only mock: install the LaunchAgent,
    # let launchd start the daemon, read it back, remove it.
    name: launchd live (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install navig
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/navig-run/plugins#subdirectory=navig-contacts"
          python -m pip install -e .
      - name: service install → status → uninstall
        env:
          NAVIG_SKIP_ONBOARDING: "1"
          NAVIG_NO_TELEMETRY: "1"
        run: |
          set -x
          python -m navig service install --method launchd --no-bot
          sleep 8
          launchctl print "gui/$(id -u)/run.navig.daemon" | head -40 || true
          python -m navig service status
          python -m navig service uninstall --method launchd
          test ! -f "$HOME/Library/LaunchAgents/run.navig.daemon.plist"
