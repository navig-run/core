name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gitleaks scan
        run: docker run -v ${{ github.workspace }}:/path ghcr.io/gitleaks/gitleaks:latest detect --source="/path" -v

  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Regenerate command registry
        # The generator refuses to overwrite the tracked manifest from an interpreter that
        # would shrink it (non-3.13, or with the first-party plugins absent — as they are in
        # this core-only CI install). --allow-interpreter acknowledges the matrix leg's own
        # version so the regen still runs; the freshness diff below is the actual gate.
        run: python tools/export_registry.py --validate --format both --deprecations-report --allow-interpreter ${{ matrix.python-version }}

      - name: Assert command registry is not stale
        run: |
          # Gate all FOUR generated artifacts, not just commands.json.
          # commands.json / commands.md / deprecations.json each embed a
          # non-deterministic `generated_at` wall-clock timestamp — so a plain
          # `git diff` false-fails on every regen and can't tell real rot from a
          # fresh timestamp (this is why the manifest silently rotted, PR #343).
          # `-I <regex>` ignores hunks whose changed lines ALL match the pattern,
          # so a pure re-timestamp passes while any real command drift still fails.
          # completions/commands.txt carries no timestamp, so it is diffed plainly.
          stale=0
          git diff --exit-code -I '"generated_at":' generated/commands.json      || stale=1
          git diff --exit-code -I '^_Generated '     generated/commands.md        || stale=1
          git diff --exit-code -I '"generated_at":' generated/deprecations.json  || stale=1
          git diff --exit-code                        generated/completions/commands.txt || stale=1
          if [ "$stale" != "0" ]; then
            echo "::error::Generated command registry is stale — regenerate & commit all four artifacts:"
            echo "  # under Python 3.13 with the first-party plugins installed (any other interpreter shrinks the catalog):"
            echo "  python tools/export_registry.py --validate --format both --deprecations-report"
            exit 1
          fi

      - name: Lint
        run: ruff check navig tests

      - name: Format check
        run: ruff format --check navig tests

      - name: Test
        run: >
          pytest
          --cov=navig.gateway.server
          --cov=navig.daemon.telegram_worker
          --cov=navig.daemon.service_manager
          --cov=navig.contracts
          --cov-report=term-missing
          --cov-fail-under=75

      - name: Guard — no test artifacts committed
        run: |
          if git ls-files | grep -Eq 'pytest_out.*\.txt|test_out.*\.txt|test_results.*\.txt'; then
            echo "ERROR: test artifact file(s) found in repository — remove and re-commit"
            git ls-files | grep -E 'pytest_out.*\.txt|test_out.*\.txt|test_results.*\.txt'
            exit 1
          fi

      - name: Guard — latest.json version matches pyproject.toml
        run: |
          PYPROJECT_VER=$(python -c "import re, pathlib; m=re.search(r'version = \"(\S+)\"', pathlib.Path('pyproject.toml').read_text()); print(m.group(1))")
          LATEST_VER=$(python -c "import json; print(json.load(open('latest.json'))['version'])")
          if [ "$PYPROJECT_VER" != "$LATEST_VER" ]; then
            echo "ERROR: version drift — pyproject.toml=$PYPROJECT_VER but latest.json=$LATEST_VER"
            echo "       Run: python scripts/_version_sync.py"
            exit 1
          fi
          echo "Version OK: $PYPROJECT_VER"

      - name: Build
        run: python -m build

  test-go:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev libappindicator3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - name: Go vet
        working-directory: host
        run: go vet ./...

      - name: Go build
        working-directory: host
        run: go build ./...

      - name: Go test
        working-directory: host
        run: go test ./...

  portability-smoke:
    runs-on: ${{ matrix.os }}
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Portability smoke tests
        run: >
          pytest
          tests/ops/test_proc.py
          tests/remote/test_remote_operations.py
          tests/ops/test_monitoring_unicode.py
          -q
          --tb=short
          --no-header
