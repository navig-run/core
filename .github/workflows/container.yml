name: container

# Publishes the MCP server as a container, which is how an MCP directory can
# introspect it without a Python environment: `docker run -i ghcr.io/navig-run/navig`.
#
# The image is built from ./Dockerfile, whose ENTRYPOINT already speaks MCP on stdio,
# and it installs `navig` from PyPI — the same artifact a user installs, so the image
# cannot drift from the documented behaviour.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/navig-run/navig
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
